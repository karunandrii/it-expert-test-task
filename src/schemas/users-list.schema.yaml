type: object
required:
    - users
    - total
    - skip
    - limit
properties:
    users:
        type: array
        items:
            type: object
            required:
                - id
                - firstName
                - lastName
                - email
                - username
            properties:
                id:
                    type: integer
                firstName:
                    type: string
                lastName:
                    type: string
                email:
                    type: string
                username:
                    type: string
                gender:
                    type: string
                image:
                    type: string
                age:
                    type: integer
            additionalProperties: true
    total:
        type: integer
    skip:
        type: integer
    limit:
        type: integer
additionalProperties: true
